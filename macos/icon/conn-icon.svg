<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Conn app icon: a speech-bubble creature mid-word. Flat shapes only.
       Edit here, then run make-icon.sh to rebuild AppIcon.icns. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#4B4D53"/>

  <!-- antenna -->
  <path d="M470 330 C 466 280 492 246 528 228" fill="none" stroke="#D08CFF" stroke-width="22" stroke-linecap="round"/>
  <circle cx="540" cy="222" r="32" fill="#DBFF3D"/>
  <path d="M590 176 L 614 152 M 598 226 L 632 226 M 498 170 L 482 146" fill="none" stroke="#DBFF3D" stroke-width="14" stroke-linecap="round"/>

  <!-- offset print edge in electric yellow-green, then the body -->
  <g transform="translate(20 18)">
    <path d="M412 330 H 612 C 702 330 760 388 760 478 V 588 C 760 678 702 736 612 736 H 452 L 330 812 L 356 724 C 300 702 264 652 264 588 V 478 C 264 388 322 330 412 330 Z" fill="#DBFF3D"/>
  </g>
  <path d="M412 330 H 612 C 702 330 760 388 760 478 V 588 C 760 678 702 736 612 736 H 452 L 330 812 L 356 724 C 300 702 264 652 264 588 V 478 C 264 388 322 330 412 330 Z" fill="#D08CFF"/>

  <!-- eyes -->
  <rect x="406" y="462" width="46" height="88" rx="23" fill="#1C1C21"/>
  <rect x="572" y="462" width="46" height="88" rx="23" fill="#1C1C21"/>
  <circle cx="436" cy="482" r="9" fill="#FFFFFF"/>
  <circle cx="602" cy="482" r="9" fill="#FFFFFF"/>

  <!-- mouth, mid-word -->
  <ellipse cx="512" cy="618" rx="34" ry="26" fill="#1C1C21"/>
  <ellipse cx="512" cy="630" rx="16" ry="9" fill="#F27BD9"/>

  <!-- voice -->
  <path d="M808 484 Q 842 533 808 582" fill="none" stroke="#DBFF3D" stroke-width="20" stroke-linecap="round"/>
  <path d="M852 446 Q 902 533 852 620" fill="none" stroke="#DBFF3D" stroke-width="20" stroke-linecap="round"/>
</svg>
